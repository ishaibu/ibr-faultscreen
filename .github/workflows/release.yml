name: release

# Publishes to PyPI with Trusted Publishing (no tokens).
#   - Publishing a GitHub release  -> builds and uploads to PyPI (environment "pypi").
#   - Running this workflow by hand (Actions tab -> release -> Run workflow)
#     -> builds and uploads to TestPyPI (environment "testpypi") for a practice run.
# The environment names must match the pending publishers set up on PyPI and TestPyPI.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Check the built package installs and runs
        run: |
          python -m pip install dist/*.whl
          ibr-faultscreen --version
          ibr-faultscreen check ieee39
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
