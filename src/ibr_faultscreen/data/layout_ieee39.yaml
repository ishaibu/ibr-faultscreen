# Drawing positions for the IEEE 39-bus (New England) test system, used by the
# network map in reports. They follow the usual one-line arrangement of this
# system: generator 10 (bus 30) and bus 2 at the upper left, the 345 kV ring
# through buses 1-9 down the left side and across the bottom, bus 16 near the
# middle, generators 6 and 7 (buses 35, 36) at the right, and bus 39 (the
# slack, generator 1 in the original numbering) at the lower left.
#
# Units are arbitrary drawing units: x to the right, y downward. The positions
# are a drawing, not geography. The same file is meant to be shared with
# SCR-Screen so both tools draw this network the same way.
#
# Checked by tests/test_report_layout.py: every bus of the case has a position,
# no two lines cross, and no bus sits on a line it is not connected to.
